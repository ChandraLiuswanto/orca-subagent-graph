<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Subagent Graph</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top">
    <header class="bar">
      <div class="seg" role="tablist" aria-label="View">
        <button data-view="live" class="on">Live</button>
        <button data-view="history">History</button>
      </div>
      <select id="range" aria-label="History range" hidden>
        <option value="1d">24 hours</option>
        <option value="7d" selected>7 days</option>
        <option value="30d">30 days</option>
        <option value="all">All</option>
      </select>
      <span id="summary" class="mut"></span>
    </header>
    <div class="tools">
      <input id="search" type="search" placeholder="Search tasks, runs, projects, models, ids" aria-label="Search" autocomplete="off" spellcheck="false" />
      <div id="filters" class="chips" role="toolbar" aria-label="Filter by status"></div>
    </div>
    </div>
    <main id="app"></main>
    <div id="toast" class="toast" hidden></div>
    <script src="graph.js"></script>
    <script src="app.js"></script>
  </body>
</html>
